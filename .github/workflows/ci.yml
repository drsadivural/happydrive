name: CI
on:
  push: { branches: [main, 'feature/**'] }
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Lint OpenAPI contract
        run: pnpm --filter @happydrive/contracts lint
      - name: Generated types are up to date
        run: pnpm --filter @happydrive/contracts check-generated

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: happydrive, POSTGRES_PASSWORD: happydrive, POSTGRES_DB: happydrive_test }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U happydrive" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @happydrive/api lint
      - run: pnpm --filter @happydrive/api typecheck
      - name: Unit + integration tests (P0 acceptance suites)
        run: pnpm --filter @happydrive/api test -- --reporter=default --reporter=junit --outputFile=test-results/api-junit.xml
        env:
          TEST_DATABASE_URL: postgresql://happydrive:happydrive@localhost:5433/happydrive_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results-${{ github.sha }}
          path: services/api/test-results
      - run: pnpm --filter @happydrive/api build

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @happydrive/design-tokens build
      - run: pnpm --filter @happydrive/partner-web --filter @happydrive/admin-web --filter @happydrive/web-ui --if-present lint
      - run: pnpm --filter @happydrive/partner-web --filter @happydrive/admin-web --filter @happydrive/web-ui --if-present typecheck
      - run: pnpm --filter @happydrive/partner-web --filter @happydrive/admin-web --filter @happydrive/web-ui --if-present test
      - run: pnpm --filter @happydrive/partner-web --filter @happydrive/admin-web build

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: happydrive, POSTGRES_PASSWORD: happydrive, POSTGRES_DB: happydrive_e2e }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U happydrive" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @happydrive/design-tokens build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          HD_E2E_DATABASE_URL: postgresql://happydrive:happydrive@localhost:5433/happydrive_e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-${{ github.sha }}
          path: |
            test-results
            playwright-report

  ios-core:
    # Non-UI Swift package (models, API client, offline queue) builds and tests on Linux.
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path apps/ios/HappyDriveCore

  ios-app:
    # Full Xcode build + UI tests. Requires a macOS runner with Xcode 16+.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app (generic iOS Simulator)
        run: xcodebuild -project apps/ios/HappyDrive.xcodeproj -scheme HappyDrive -destination 'generic/platform=iOS Simulator' -configuration Debug build CODE_SIGNING_ALLOWED=NO
      - name: Pick an iPhone simulator
        id: sim
        run: |
          # Runner images differ in which simulators are installed; use any available iPhone,
          # creating one from the newest installed iOS runtime if none exists.
          udid=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin)["devices"]; print(next((x["udid"] for rt,ds in sorted(d.items(), reverse=True) if "iOS" in rt for x in ds if x["name"].startswith("iPhone")), ""))')
          if [ -z "$udid" ]; then
            runtime=$(xcrun simctl list runtimes available -j | python3 -c 'import sys,json; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS"]; print(r[-1]["identifier"] if r else "")')
            devtype=$(xcrun simctl list devicetypes -j | python3 -c 'import sys,json; t=[x for x in json.load(sys.stdin)["devicetypes"] if x["name"].startswith("iPhone")]; print(t[-1]["identifier"])')
            test -n "$runtime" || { echo "No iOS simulator runtime installed on this runner"; exit 1; }
            udid=$(xcrun simctl create "CI iPhone" "$devtype" "$runtime")
          fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$udid"
      - name: HappyAvatarKit unit tests (iOS Simulator)
        working-directory: apps/ios/HappyAvatarKit
        run: xcodebuild test -scheme HappyAvatarKit -destination "id=${{ steps.sim.outputs.udid }}" CODE_SIGNING_ALLOWED=NO

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Dependency vulnerabilities (high and above fail the build)
        run: pnpm audit --audit-level high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

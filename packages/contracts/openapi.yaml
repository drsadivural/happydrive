openapi: 3.1.0
info:
  title: HappyDrive API
  version: 1.1.0
  description: |
    日本語iOS・企業ポータル・運営Web共通契約。全書込に監査イベントを記録する。
    v1.0（docs/spec/openapi.v1.0-original.yaml）からの変更は後方互換の追加のみ。変更履歴は docs/CONTRACT_CHANGELOG.md。
    - 時刻はUTC（ISO 8601）で送受信し、表示はJST。金額は整数JPY。
    - エラーは常に Error スキーマ（message は日本語）。
    - 重要な書込は Idempotency-Key 必須。同一キー・同一内容の再送は同じ応答を返し、内容が異なれば 422 idempotency_mismatch。
servers:
  - url: https://api.happydrive.jp/v1
  - url: http://localhost:8080/v1
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Auth
  - name: Identity
  - name: Delivery
  - name: Jobs
  - name: Evidence
  - name: Messaging
  - name: Notifications
  - name: Earnings
  - name: Learning
  - name: Organization
  - name: Admin
  - name: Webhooks
paths:
  /healthz:
    get:
      tags: [System]
      operationId: healthz
      security: []
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 生存確認, content: {application/json: {schema: {type: object, required: [status], properties: {status: {type: string}}}}}}
  /readyz:
    get:
      tags: [System]
      operationId: readyz
      security: []
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 依存先接続OK, content: {application/json: {schema: {type: object, required: [status], properties: {status: {type: string}, checks: {type: object, additionalProperties: {type: string}}}}}}}
        '503': {$ref: '#/components/responses/Unavailable'}

  # ---------------------------------------------------------------- Auth
  /auth/otp/request:
    post:
      tags: [Auth]
      operationId: requestOtp
      security: []
      description: 電話番号へ6桁の確認コードを送信。番号単位・IP単位でレート制限。 退会後30日以内の番号は 403 account_deleted。App Store 審査用の1番号のみ、サーバー設定の固定コードで認証できる（SMS送信なし）。
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [phone], properties: {phone: {type: string, pattern: '^(\+81|0)[0-9]{9,10}$'}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '202': {description: 送信受付, content: {application/json: {schema: {type: object, required: [expiresAt, resendAfterSeconds], properties: {expiresAt: {type: string, format: date-time}, resendAfterSeconds: {type: integer}}}}}}
        '422': {$ref: '#/components/responses/Validation'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/otp/verify:
    post:
      tags: [Auth]
      operationId: verifyOtp
      security: []
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [phone, code], properties: {phone: {type: string, pattern: '^(\+81|0)[0-9]{9,10}$'}, code: {type: string, pattern: '^[0-9]{6}$'}, deviceName: {type: string, maxLength: 100}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: ログイン成功, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResult'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/device:
    post:
      tags: [Auth]
      operationId: deviceLogin
      security: []
      description: |
        ドライバーアプリの端末アカウントでログイン（電話番号確認なし）。アプリは初回起動時に256bit以上の乱数（base64url）を生成して
        キーチェーンに保存し、以後同じ値で送る。未登録の値なら新しいドライバーアカウントを作成する（isNewUser=true）。
        サーバーは値の HMAC のみ保存する。新規作成は IP 単位で回数制限。案件の受諾には従来どおり本人確認が必要。
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [deviceSecret], properties: {deviceSecret: {type: string, minLength: 43, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$'}, deviceName: {type: string, maxLength: 100}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: ログイン成功, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResult'}}}}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      security: []
      description: リフレッシュトークンをローテーション。使用済みトークンの再利用を検知したら同系列を全失効。
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [refreshToken], properties: {refreshToken: {type: string, minLength: 20}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 新トークン, content: {application/json: {schema: {$ref: '#/components/schemas/Tokens'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [refreshToken], properties: {refreshToken: {type: string}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '204': {description: ログアウト}
  /auth/web/signup:
    post:
      tags: [Auth]
      operationId: webSignup
      security: []
      description: 企業担当者のWebアカウント作成。作成後はMFA登録が必要。
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [email, password, displayName], properties: {email: {type: string, format: email, maxLength: 254}, password: {type: string, minLength: 12, maxLength: 200}, displayName: {type: string, minLength: 1, maxLength: 60}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '201': {description: 作成, content: {application/json: {schema: {$ref: '#/components/schemas/WebLoginChallenge'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/web/login:
    post:
      tags: [Auth]
      operationId: webLogin
      security: []
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [email, password], properties: {email: {type: string, format: email}, password: {type: string, maxLength: 200}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: MFA要求, content: {application/json: {schema: {$ref: '#/components/schemas/WebLoginChallenge'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
  /auth/web/mfa/verify:
    post:
      tags: [Auth]
      operationId: webMfaVerify
      security: []
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [mfaToken, code], properties: {mfaToken: {type: string}, code: {type: string, pattern: '^[0-9]{6}$'}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: ログイン成功, content: {application/json: {schema: {$ref: '#/components/schemas/AuthResult'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/TooManyRequests'}

  # ---------------------------------------------------------------- Identity
  /me:
    get:
      tags: [Identity]
      operationId: getMe
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200':
          description: 利用者情報
          content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    patch:
      tags: [Identity]
      operationId: updateMe
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {displayName: {type: string, minLength: 1, maxLength: 60}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 更新, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
    delete:
      tags: [Identity]
      operationId: requestAccountDeletion
      description: 削除要求を登録し、復元・保持例外を説明して確定する。confirm=true で確定。進行中の業務・未払い報酬がある場合は 409。
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: false, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {confirm: {type: boolean}, reason: {type: string, maxLength: 1000}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '202': {description: 削除要求受理, content: {application/json: {schema: {$ref: '#/components/schemas/DeletionRequest'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /me/terms:
    post:
      tags: [Identity]
      operationId: acceptTerms
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [termsVersion, privacyVersion], properties: {termsVersion: {type: string}, privacyVersion: {type: string}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 同意記録, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '422': {$ref: '#/components/responses/Validation'}
  /me/profile:
    put:
      tags: [Identity]
      operationId: updateProfile
      description: 本人情報（暗号化保存）。変更後は再審査が必要になる場合がある。
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProfileInput'}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 更新, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '422': {$ref: '#/components/responses/Validation'}
  /me/vehicle:
    put:
      tags: [Identity]
      operationId: updateVehicle
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Vehicle'}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 更新, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
  /me/bank-account:
    put:
      tags: [Identity]
      operationId: updateBankAccount
      description: 振込先。応答では口座番号を末尾4桁のみ返す。
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BankAccountInput'}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 更新, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '422': {$ref: '#/components/responses/Validation'}
  /me/verification:
    post:
      tags: [Identity]
      operationId: submitVerification
      description: 本人確認書類（evidence purpose=identity_document）を添えて審査を申請。
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [documentEvidenceIds], properties: {documentEvidenceIds: {type: array, minItems: 1, maxItems: 4, items: {type: string, format: uuid}}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '202': {description: 審査待ち, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
  /me/skills:
    post:
      tags: [Identity]
      operationId: submitSkill
      description: 資格証の提出（evidence purpose=skill_document）。運営が確認して verified になる。
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [skillCode, documentEvidenceIds], properties: {skillCode: {type: string}, validUntil: {type: string, format: date}, documentEvidenceIds: {type: array, minItems: 1, maxItems: 4, items: {type: string, format: uuid}}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '202': {description: 確認待ち, content: {application/json: {schema: {$ref: '#/components/schemas/Skill'}}}}
        '422': {$ref: '#/components/responses/Validation'}
  /skills/catalog:
    get:
      tags: [Identity]
      operationId: listSkillCatalog
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 資格・講習の一覧, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SkillDefinition'}}}}}
  /me/preferences:
    put:
      tags: [Identity]
      operationId: updatePreferences
      description: 指定した項目のみ更新（部分更新、既存の他項目は保持）。
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Preferences'}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 更新, content: {application/json: {schema: {$ref: '#/components/schemas/User'}}}}
  /me/devices:
    post:
      tags: [Identity]
      operationId: registerDevice
      description: APNs トークン登録。プッシュのペイロードは aps.alert（title/body）に加え entityType / entityId / notificationId を含む。
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [apnsToken, environment], properties: {apnsToken: {type: string, pattern: '^[0-9a-fA-F]{32,200}$'}, environment: {type: string, enum: [sandbox, production]}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '204': {description: 登録}
  /me/devices/{apnsToken}:
    delete:
      tags: [Identity]
      operationId: unregisterDevice
      parameters: [{name: apnsToken, in: path, required: true, schema: {type: string}}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '204': {description: 解除}
  /support/tickets:
    post:
      tags: [Identity]
      operationId: createSupportTicket
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [category, body], properties: {category: {type: string, enum: [account, payment, job, delivery, safety, privacy, other]}, body: {type: string, minLength: 1, maxLength: 4000}, assignmentId: {type: string, format: uuid}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '201': {description: 受付, content: {application/json: {schema: {$ref: '#/components/schemas/SupportTicket'}}}}
    get:
      tags: [Identity]
      operationId: listMySupportTickets
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 自分の問い合わせ, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SupportTicket'}}}}}

  # ---------------------------------------------------------------- Delivery
  /delivery/stops:
    get:
      tags: [Delivery]
      operationId: listStops
      parameters:
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 停止地点, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Stop'}}}}}
    post:
      tags: [Delivery]
      operationId: addStop
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NewStop'}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '201': {description: 登録, content: {application/json: {schema: {$ref: '#/components/schemas/Stop'}}}}
        '409': {description: '重複の可能性（details.existingStopId）。確認後 allowDuplicate=true で再送', content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
        '422': {$ref: '#/components/responses/Validation'}
  /delivery/stops/import:
    post:
      tags: [Delivery]
      operationId: importStops
      description: |
        CSV一括取込（UTF-8、ヘッダ行必須）。列: address（必須）, latitude, longitude, time_start(HH:MM), time_end(HH:MM), priority(0-2), service_minutes, recipient_name, recipient_phone, package_number, note。
        dryRun=true の場合は登録せず検証結果と重複候補のみ返す。
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [scheduledDate, csv], properties: {scheduledDate: {type: string, format: date}, csv: {type: string, minLength: 1, maxLength: 500000}, dryRun: {type: boolean}, skipDuplicates: {type: boolean}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 取込結果, content: {application/json: {schema: {$ref: '#/components/schemas/StopImportResult'}}}}
        '422': {$ref: '#/components/responses/Validation'}
  /delivery/stops/{stopId}:
    get:
      tags: [Delivery]
      operationId: getStop
      parameters: [{$ref: '#/components/parameters/StopId'}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 配送先, content: {application/json: {schema: {$ref: '#/components/schemas/Stop'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Delivery]
      operationId: updateStop
      description: draft/ready の配送先のみ編集可能。version で楽観ロック。
      parameters: [{$ref: '#/components/parameters/StopId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/StopUpdate'}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 更新, content: {application/json: {schema: {$ref: '#/components/schemas/Stop'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
    delete:
      tags: [Delivery]
      operationId: deleteStop
      parameters: [{$ref: '#/components/parameters/StopId'}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '204': {description: 削除}
        '409': {$ref: '#/components/responses/Conflict'}
  /delivery/stops/{stopId}/contact:
    get:
      tags: [Delivery]
      operationId: getStopContact
      description: 受取人の電話番号を必要時のみ取得（アクセスは監査記録）。配送完了/保管期限後は取得不可。
      parameters: [{$ref: '#/components/parameters/StopId'}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 連絡先, content: {application/json: {schema: {type: object, required: [recipientPhone], properties: {recipientPhone: {type: string}, recipientName: {type: string}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '410': {$ref: '#/components/responses/Gone'}
  /delivery/routes/optimize:
    post:
      tags: [Delivery]
      operationId: optimizeRoute
      description: |
        制約付き推奨ルートを計算して保存。厳密な最適解は保証しない。
        道路所要時間の提供元と契約がない構成では直線距離×道路係数による概算（travelTimeSource=estimated）と明示。
        位置未確定の配送先を含むと 422 (stop_without_location)。運行中ルートの再計算は停車中（arrived以外の移動中でない）のみ。
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RouteRequest'}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 制約付き推奨ルート, content: {application/json: {schema: {$ref: '#/components/schemas/Route'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
  /delivery/routes:
    get:
      tags: [Delivery]
      operationId: getRoute
      parameters:
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: その日の最新ルート, content: {application/json: {schema: {$ref: '#/components/schemas/Route'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /delivery/routes/{routeId}/reorder:
    post:
      tags: [Delivery]
      operationId: reorderRoute
      description: ドライバーによる手動の並べ替え。到着見込みを再計算し、制約違反を警告として返す。
      parameters: [{name: routeId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [orderedStopIds], properties: {orderedStopIds: {type: array, minItems: 1, items: {type: string, format: uuid}}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 更新ルート, content: {application/json: {schema: {$ref: '#/components/schemas/Route'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
  /delivery/routes/{routeId}/start:
    post:
      tags: [Delivery]
      operationId: startRoute
      description: ルートを開始。ready の配送先のうち先頭を en_route にする。
      parameters: [{name: routeId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 開始済み, content: {application/json: {schema: {$ref: '#/components/schemas/Route'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /delivery/stops/{stopId}/events:
    post:
      tags: [Delivery]
      operationId: recordStopEvent
      description: |
        状態遷移 draft→ready→en_route→arrived→delivered/failed/deferred。
        端末で記録した occurredAt を保持し、オフライン復帰時の再送は Idempotency-Key で重複しない。
        failed/deferred は failureReason 必須、deferred は deferredUntil 必須。
      parameters: [{$ref: '#/components/parameters/StopId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [eventType], properties: {eventType: {type: string, enum: [en_route, arrived, delivered, failed, deferred]}, failureReason: {type: string, enum: [absent, address_unknown, refused, damaged, access_denied, time_window_missed, other]}, failureNote: {type: string, maxLength: 1000}, deferredUntil: {type: string, format: date-time}, handoff: {type: string, enum: [in_person, safe_place, delivery_box, neighbor]}, evidenceIds: {type: array, items: {type: string, format: uuid}}, location: {$ref: '#/components/schemas/Point'}, occurredAt: {type: string, format: date-time}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 更新済み配送先, content: {application/json: {schema: {$ref: '#/components/schemas/Stop'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
  /delivery/reports/daily:
    get:
      tags: [Delivery]
      operationId: getDeliveryReport
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 日次集計, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/DeliveryDayReport'}}}}}

  # ---------------------------------------------------------------- Jobs (worker)
  /home:
    get:
      tags: [Jobs]
      operationId: getHome
      description: ホーム画面の集約（今日の配送・案件・予定報酬・未読通知・近隣提案）。
      parameters:
        - {name: latitude, in: query, schema: {type: number, minimum: -90, maximum: 90}}
        - {name: longitude, in: query, schema: {type: number, minimum: -180, maximum: 180}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: ホーム, content: {application/json: {schema: {$ref: '#/components/schemas/HomeSummary'}}}}
  /jobs:
    get:
      tags: [Jobs]
      operationId: searchJobs
      description: |
        公開案件の検索。位置を渡さない場合（位置拒否）は areaQuery による手動エリア検索。
        sort=recommended はハード条件（資格・時間重複・停止・距離上限）を満たす案件のみを説明可能なスコアで並べ、matchReasons を返す。
      parameters:
        - {name: latitude, in: query, schema: {type: number, minimum: -90, maximum: 90}}
        - {name: longitude, in: query, schema: {type: number, minimum: -180, maximum: 180}}
        - {name: radiusKm, in: query, schema: {type: number, minimum: 0.5, maximum: 100}}
        - {name: areaQuery, in: query, schema: {type: string, maxLength: 60}}
        - {name: q, in: query, schema: {type: string, maxLength: 60}}
        - {name: category, in: query, schema: {$ref: '#/components/schemas/JobCategory'}}
        - {name: date, in: query, schema: {type: string, format: date}}
        - {name: startAfterHour, in: query, schema: {type: integer, minimum: 0, maximum: 23}}
        - {name: minAmountYen, in: query, schema: {type: integer, minimum: 0}}
        - {name: eligibleOnly, in: query, schema: {type: boolean}}
        - {name: favoritesOnly, in: query, schema: {type: boolean}}
        - {name: sort, in: query, schema: {type: string, enum: [recommended, distance, starts_at, amount]}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 公開案件, content: {application/json: {schema: {type: object, required: [items], properties: {items: {type: array, items: {$ref: '#/components/schemas/Job'}}, nextCursor: {type: string}}}}}}
  /jobs/{jobId}:
    get:
      tags: [Jobs]
      operationId: getJob
      parameters: [{$ref: '#/components/parameters/JobId'}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 案件詳細, content: {application/json: {schema: {$ref: '#/components/schemas/Job'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /jobs/{jobId}/accept:
    post:
      tags: [Jobs]
      operationId: acceptJob
      description: |
        同一トランザクションで資格と残枠を検査。Idempotency-Key必須。
        受諾時点の条件（報酬・費用負担・キャンセル規則・支払予定）をスナップショット保存し、termsHash が表示中の条件と一致しない場合は 409 terms_changed。
        requiresOrgApproval の案件は state=reserved（期限付き）で返る。
        エラーコード: 403 not_eligible（details.reasons / details.codes）、404 案件なし・募集終了、409 capacity_full（空き待ち登録可）/ time_conflict / terms_changed / job_started / already_accepted（details.assignmentId）。
      parameters: [{$ref: '#/components/parameters/JobId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: false, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {termsHash: {type: string}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '201': {description: 受諾確定, content: {application/json: {schema: {$ref: '#/components/schemas/Assignment'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /jobs/{jobId}/favorite:
    put:
      tags: [Jobs]
      operationId: favoriteJob
      parameters: [{$ref: '#/components/parameters/JobId'}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '204': {description: お気に入り登録}
    delete:
      tags: [Jobs]
      operationId: unfavoriteJob
      parameters: [{$ref: '#/components/parameters/JobId'}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '204': {description: 解除}
  /jobs/{jobId}/waitlist:
    put:
      tags: [Jobs]
      operationId: joinWaitlist
      description: 満員の案件の空き待ち。空きが出たら先着順に通知（自動確保はしない）。
      parameters: [{$ref: '#/components/parameters/JobId'}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '204': {description: 登録}
        '409': {$ref: '#/components/responses/Conflict'}
    delete:
      tags: [Jobs]
      operationId: leaveWaitlist
      parameters: [{$ref: '#/components/parameters/JobId'}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '204': {description: 解除}
  /matching/appeals:
    post:
      tags: [Jobs]
      operationId: createMatchingAppeal
      description: 推薦・除外への異議申立て。運営が確認し回答する。
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [body], properties: {jobId: {type: string, format: uuid}, body: {type: string, minLength: 1, maxLength: 2000}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '201': {description: 受付, content: {application/json: {schema: {$ref: '#/components/schemas/SupportTicket'}}}}
  /assignments:
    get:
      tags: [Jobs]
      operationId: listMyAssignments
      parameters:
        - {name: scope, in: query, schema: {type: string, enum: [active, upcoming, history, all]}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 自分の割当, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Assignment'}}}}}
  /assignments/{assignmentId}:
    get:
      tags: [Jobs]
      operationId: getAssignment
      description: 本人・発注組織・運営のみ取得可能。住所は本人には受諾後、発注組織には常に表示。
      parameters: [{$ref: '#/components/parameters/AssignmentId'}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 割当, content: {application/json: {schema: {$ref: '#/components/schemas/Assignment'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /assignments/{assignmentId}/events:
    post:
      tags: [Jobs]
      operationId: advanceAssignment
      description: |
        業務状態の進行。checked_in は location 必須で、案件地点から checkInRadiusMeters 以内かつ開始30分前以降。
        step_completed は stepIndex 必須。submitted は全手順完了と必須証跡数を検査。
        submitted は working または needs_revision（差戻し後の再提出）から可能。cancelled は reserved/accepted/traveling から可能で、note に理由を記載できる。
        cancelled はキャンセル規則を適用（締切後は late 扱いとして記録）。safety_alert / help_requested は運営に即時通知。
      parameters: [{$ref: '#/components/parameters/AssignmentId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [eventType], properties: {eventType: {type: string, enum: [traveling, checked_in, working, step_completed, submitted, cancelled, safety_alert, help_requested]}, stepIndex: {type: integer, minimum: 0}, evidenceIds: {type: array, items: {type: string, format: uuid}}, note: {type: string, maxLength: 2000}, location: {$ref: '#/components/schemas/Point'}, occurredAt: {type: string, format: date-time}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 更新済み割当, content: {application/json: {schema: {$ref: '#/components/schemas/Assignment'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
  /assignments/{assignmentId}/location:
    post:
      tags: [Jobs]
      operationId: shareLocation
      description: 業務中（traveling/checked_in/working）のみ受け付ける限定位置共有。発注者には最新1点のみ・終了後は非表示。保持期間後に自動削除。
      parameters: [{$ref: '#/components/parameters/AssignmentId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [location], properties: {location: {$ref: '#/components/schemas/Point'}, accuracyMeters: {type: number, minimum: 0}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '204': {description: 受付}
        '409': {$ref: '#/components/responses/Conflict'}
  /assignments/{assignmentId}/rating:
    post:
      tags: [Jobs]
      operationId: rateAssignment
      description: 検収後の相互評価（ドライバー→発注者、発注者→ドライバー）。1回のみ。
      parameters: [{$ref: '#/components/parameters/AssignmentId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [score], properties: {score: {type: integer, minimum: 1, maximum: 5}, comment: {type: string, maxLength: 500}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '204': {description: 記録}
        '409': {$ref: '#/components/responses/Conflict'}
  /assignments/{assignmentId}/messages:
    get:
      tags: [Messaging]
      operationId: listMessages
      parameters: [{$ref: '#/components/parameters/AssignmentId'}, {name: after, in: query, schema: {type: string, format: date-time}}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 案件チャット, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Message'}}}}}
    post:
      tags: [Messaging]
      operationId: sendMessage
      parameters: [{$ref: '#/components/parameters/AssignmentId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [body], properties: {body: {type: string, minLength: 1, maxLength: 2000}, evidenceId: {type: string, format: uuid}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '201': {description: 送信, content: {application/json: {schema: {$ref: '#/components/schemas/Message'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /reports:
    post:
      tags: [Messaging]
      operationId: createReport
      description: 不適切なメッセージ・案件・利用者の通報。
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [targetType, targetId, reason], properties: {targetType: {type: string, enum: [message, job, user, organization]}, targetId: {type: string, format: uuid}, reason: {type: string, enum: [harassment, fraud, unsafe, illegal, spam, privacy, other]}, detail: {type: string, maxLength: 2000}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '201': {description: 受付, content: {application/json: {schema: {$ref: '#/components/schemas/Report'}}}}
  /blocks:
    post:
      tags: [Messaging]
      operationId: blockOrganization
      description: 発注組織をブロック。以後その組織の案件は検索・推薦に出ない。
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [organizationId], properties: {organizationId: {type: string, format: uuid}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '204': {description: ブロック}

  # ---------------------------------------------------------------- Evidence
  /evidence/uploads:
    post:
      tags: [Evidence]
      operationId: createEvidenceUpload
      description: |
        短命アップロードURLを発行。assignmentId / deliveryStopId / purpose(identity_document, skill_document, message_attachment) のいずれか1つに紐付く。
        アップロード後に /evidence/{evidenceId}/complete で内容（マジックバイト・サイズ・SHA-256）を検証する。
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [contentType, byteSize, sha256], properties: {assignmentId: {type: string, format: uuid}, deliveryStopId: {type: string, format: uuid}, purpose: {type: string, enum: [work_photo, delivery_photo, signature, identity_document, skill_document, message_attachment]}, contentType: {type: string, enum: [image/jpeg, image/png]}, byteSize: {type: integer, minimum: 1, maximum: 15000000}, sha256: {type: string, pattern: '^[a-f0-9]{64}$'}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '201': {description: 短命アップロードURL, content: {application/json: {schema: {type: object, required: [evidenceId, uploadUrl, expiresAt], properties: {evidenceId: {type: string, format: uuid}, uploadUrl: {type: string, format: uri}, uploadMethod: {type: string, enum: [PUT]}, uploadHeaders: {type: object, additionalProperties: {type: string}}, expiresAt: {type: string, format: date-time}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Validation'}
  /evidence/{evidenceId}/complete:
    post:
      tags: [Evidence]
      operationId: completeEvidenceUpload
      parameters: [{name: evidenceId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 検証済み, content: {application/json: {schema: {$ref: '#/components/schemas/Evidence'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Validation'}
  /evidence/{evidenceId}/url:
    get:
      tags: [Evidence]
      operationId: getEvidenceDownloadUrl
      description: 権限を持つ利用者に有効期限付き署名URLを返す（アクセスは監査記録）。URLのホストはオブジェクトストレージ（本番はS3互換ストレージのドメイン、開発はAPIの /v1/evidence-blobs）。Webの CSP img-src にそのホストを許可すること。
      parameters: [{name: evidenceId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 署名URL, content: {application/json: {schema: {type: object, required: [url, expiresAt], properties: {url: {type: string, format: uri}, expiresAt: {type: string, format: date-time}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /evidence-blobs/{token}:
    put:
      tags: [Evidence]
      operationId: uploadEvidenceBlobLocal
      security: []
      description: ローカル/検証環境の署名付きアップロード先（本番はS3互換ストレージの署名URLを使用し、このエンドポイントは無効）。
      parameters: [{name: token, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {image/jpeg: {schema: {type: string, format: binary}}, image/png: {schema: {type: string, format: binary}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '204': {description: 保存}
        '403': {$ref: '#/components/responses/Forbidden'}
    get:
      tags: [Evidence]
      operationId: downloadEvidenceBlobLocal
      security: []
      parameters: [{name: token, in: path, required: true, schema: {type: string}}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 画像, content: {image/jpeg: {schema: {type: string, format: binary}}}}
        '403': {$ref: '#/components/responses/Forbidden'}

  # ---------------------------------------------------------------- Notifications
  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      parameters: [{name: unreadOnly, in: query, schema: {type: boolean}}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: アプリ内通知, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Notification'}}}}}
  /notifications/read:
    post:
      tags: [Notifications]
      operationId: markNotificationsRead
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, properties: {ids: {type: array, items: {type: string, format: uuid}}, all: {type: boolean}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '204': {description: 既読}

  # ---------------------------------------------------------------- Earnings
  /earnings:
    get:
      tags: [Earnings]
      operationId: getEarnings
      parameters: [{name: month, in: query, schema: {type: string, pattern: '^[0-9]{4}-[0-9]{2}$'}}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 報酬台帳, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/EarningEntry'}}}}}
  /earnings/summary:
    get:
      tags: [Earnings]
      operationId: getEarningsSummary
      parameters: [{name: month, in: query, schema: {type: string, pattern: '^[0-9]{4}-[0-9]{2}$'}}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 月次集計, content: {application/json: {schema: {$ref: '#/components/schemas/EarningsSummary'}}}}
  /payouts:
    get:
      tags: [Earnings]
      operationId: listMyPayouts
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 振込履歴, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Payout'}}}}}

  # ---------------------------------------------------------------- Learning
  /learning/courses:
    get:
      tags: [Learning]
      operationId: listCourses
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 講習一覧, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/CourseSummary'}}}}}
  /learning/courses/{courseId}:
    get:
      tags: [Learning]
      operationId: getCourse
      parameters: [{name: courseId, in: path, required: true, schema: {type: string}}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 講習, content: {application/json: {schema: {$ref: '#/components/schemas/Course'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /learning/courses/{courseId}/attempts:
    post:
      tags: [Learning]
      operationId: submitQuizAttempt
      description: 確認テストの採点はサーバー側。合格すると講習由来の資格（例 生活支援講習）が有効期限付きで付与される。
      parameters: [{name: courseId, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [answers], properties: {answers: {type: array, items: {type: object, additionalProperties: false, required: [questionId, choiceIndex], properties: {questionId: {type: string}, choiceIndex: {type: integer, minimum: 0}}}}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 採点結果, content: {application/json: {schema: {$ref: '#/components/schemas/QuizResult'}}}}
        '404': {$ref: '#/components/responses/NotFound'}

  # ---------------------------------------------------------------- Organization
  /organizations:
    post:
      tags: [Organization]
      operationId: registerOrganization
      description: 企業・自治体の登録申請。作成者は owner。運営審査で approved になるまで案件を公開できない。
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OrganizationInput'}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '201': {description: 申請, content: {application/json: {schema: {$ref: '#/components/schemas/Organization'}}}}
        '422': {$ref: '#/components/responses/Validation'}
  /organizations/{organizationId}:
    get:
      tags: [Organization]
      operationId: getOrganization
      parameters: [{$ref: '#/components/parameters/OrganizationId'}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 組織, content: {application/json: {schema: {$ref: '#/components/schemas/Organization'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Organization]
      operationId: updateOrganization
      description: owner のみ。法的情報の変更は再審査（pending）になる。
      parameters: [{$ref: '#/components/parameters/OrganizationId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/OrganizationInput'}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 更新, content: {application/json: {schema: {$ref: '#/components/schemas/Organization'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /organizations/{organizationId}/dashboard:
    get:
      tags: [Organization]
      operationId: getOrganizationDashboard
      parameters: [{$ref: '#/components/parameters/OrganizationId'}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: ダッシュボード, content: {application/json: {schema: {$ref: '#/components/schemas/OrganizationDashboard'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /organizations/{organizationId}/sites:
    get:
      tags: [Organization]
      operationId: listSites
      parameters: [{$ref: '#/components/parameters/OrganizationId'}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 拠点, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Site'}}}}}
    post:
      tags: [Organization]
      operationId: createSite
      parameters: [{$ref: '#/components/parameters/OrganizationId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SiteInput'}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '201': {description: 作成, content: {application/json: {schema: {$ref: '#/components/schemas/Site'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /organizations/{organizationId}/sites/{siteId}:
    put:
      tags: [Organization]
      operationId: updateSite
      parameters: [{$ref: '#/components/parameters/OrganizationId'}, {name: siteId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/SiteInput'}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 更新, content: {application/json: {schema: {$ref: '#/components/schemas/Site'}}}}
    delete:
      tags: [Organization]
      operationId: deleteSite
      parameters: [{$ref: '#/components/parameters/OrganizationId'}, {name: siteId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '204': {description: 削除}
  /organizations/{organizationId}/members:
    get:
      tags: [Organization]
      operationId: listMembers
      parameters: [{$ref: '#/components/parameters/OrganizationId'}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: メンバー, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Member'}}}}}
    post:
      tags: [Organization]
      operationId: addMember
      description: owner のみ。既存のWebアカウントをメールアドレスで追加。
      parameters: [{$ref: '#/components/parameters/OrganizationId'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [email, role], properties: {email: {type: string, format: email}, role: {type: string, enum: [owner, manager, reviewer]}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '201': {description: 追加, content: {application/json: {schema: {$ref: '#/components/schemas/Member'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /organizations/{organizationId}/members/{userId}:
    delete:
      tags: [Organization]
      operationId: removeMember
      parameters: [{$ref: '#/components/parameters/OrganizationId'}, {name: userId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '204': {description: 削除}
        '409': {$ref: '#/components/responses/Conflict'}
  /organizations/{organizationId}/jobs:
    get:
      tags: [Organization]
      operationId: listOrganizationJobs
      parameters: [{$ref: '#/components/parameters/OrganizationId'}, {name: status, in: query, schema: {$ref: '#/components/schemas/JobStatus'}}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 自社案件, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/OrgJob'}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Organization]
      operationId: createJob
      parameters:
        - {$ref: '#/components/parameters/OrganizationId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NewJob'}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '201': {description: 下書き, content: {application/json: {schema: {$ref: '#/components/schemas/OrgJob'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Validation'}
  /organizations/{organizationId}/jobs/{jobId}:
    get:
      tags: [Organization]
      operationId: getOrganizationJob
      parameters: [{$ref: '#/components/parameters/OrganizationId'}, {$ref: '#/components/parameters/JobId'}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 案件, content: {application/json: {schema: {$ref: '#/components/schemas/OrgJob'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Organization]
      operationId: updateJob
      description: draft / rejected の案件のみ編集可能（公開後の条件変更は不可。取消して再作成）。
      parameters: [{$ref: '#/components/parameters/OrganizationId'}, {$ref: '#/components/parameters/JobId'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/NewJob'}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 更新, content: {application/json: {schema: {$ref: '#/components/schemas/OrgJob'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
  /organizations/{organizationId}/jobs/{jobId}/submit:
    post:
      tags: [Organization]
      operationId: submitJobForReview
      description: 公開前チェック（企業審査済・必須表示事項・禁止/要資格カテゴリ・契約区分）を通過すると pending_review。自動公開規則を満たし運営レビュー不要の場合もレビュー記録を残す。
      parameters: [{$ref: '#/components/parameters/OrganizationId'}, {$ref: '#/components/parameters/JobId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 審査待ち, content: {application/json: {schema: {$ref: '#/components/schemas/OrgJob'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
  /organizations/{organizationId}/jobs/{jobId}/cancel:
    post:
      tags: [Organization]
      operationId: cancelJob
      description: 案件取消。受諾済みの割当はキャンセル規則に従い補償の台帳を作成し、全員に通知。
      parameters: [{$ref: '#/components/parameters/OrganizationId'}, {$ref: '#/components/parameters/JobId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [reason], properties: {reason: {type: string, minLength: 1, maxLength: 1000}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 取消, content: {application/json: {schema: {$ref: '#/components/schemas/OrgJob'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /organizations/{organizationId}/jobs/{jobId}/assignments:
    get:
      tags: [Organization]
      operationId: listJobAssignments
      parameters: [{$ref: '#/components/parameters/OrganizationId'}, {$ref: '#/components/parameters/JobId'}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 応募・割当, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Assignment'}}}}}
  /organizations/{organizationId}/assignments:
    get:
      tags: [Organization]
      operationId: listOrganizationAssignments
      description: 実施・検収画面用。state で絞り込み。
      parameters: [{$ref: '#/components/parameters/OrganizationId'}, {name: state, in: query, schema: {$ref: '#/components/schemas/AssignmentState'}}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 割当, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Assignment'}}}}}
  /assignments/{assignmentId}/reservation:
    post:
      tags: [Organization]
      operationId: decideReservation
      description: 発注者承認が必要な案件の予約（reserved）を承認/却下。却下・期限切れで枠は解放。
      parameters: [{$ref: '#/components/parameters/AssignmentId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [decision], properties: {decision: {type: string, enum: [approve, decline]}, reason: {type: string, maxLength: 1000}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 結果, content: {application/json: {schema: {$ref: '#/components/schemas/Assignment'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /assignments/{assignmentId}/review:
    post:
      tags: [Organization]
      operationId: reviewAssignment
      description: 検収。approved で報酬台帳（earned）を作成し payable。needs_revision は理由必須で再提出可能。disputed は運営の紛争対応へ。
      parameters: [{$ref: '#/components/parameters/AssignmentId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties: {decision: {type: string, enum: [approved, needs_revision, disputed]}, reason: {type: string, maxLength: 1000}}
              if: {properties: {decision: {enum: [needs_revision, disputed]}}}
              then: {required: [reason], properties: {reason: {minLength: 1}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 検収状態, content: {application/json: {schema: {$ref: '#/components/schemas/Assignment'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
  /assignments/{assignmentId}/no-show:
    post:
      tags: [Organization]
      operationId: reportNoShow
      description: 開始時刻から猶予（30分）経過後もチェックインがない場合のみ。枠を解放して再募集し、空き待ちへ通知。
      parameters: [{$ref: '#/components/parameters/AssignmentId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [reason], properties: {reason: {type: string, maxLength: 1000}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 記録, content: {application/json: {schema: {$ref: '#/components/schemas/Assignment'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /assignments/{assignmentId}/live-location:
    get:
      tags: [Organization]
      operationId: getLiveLocation
      description: 発注者向け。業務中のみ最新1点（軌跡は返さない）。業務終了・位置共有停止後は 404。
      parameters: [{$ref: '#/components/parameters/AssignmentId'}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 最新位置, content: {application/json: {schema: {type: object, required: [location, recordedAt], properties: {location: {$ref: '#/components/schemas/Point'}, recordedAt: {type: string, format: date-time}}}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /organizations/{organizationId}/invoices:
    get:
      tags: [Organization]
      operationId: listInvoices
      description: 検収済み業務の月次請求明細（ledger から算出）。
      parameters: [{$ref: '#/components/parameters/OrganizationId'}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 請求, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Invoice'}}}}}

  # ---------------------------------------------------------------- Admin
  /admin/users:
    get:
      tags: [Admin]

        publishedJobCount: {type: integer}
        activeWorkersToday: {type: integer}
        awaitingReviewCount: {type: integer}
        pendingReservationCount: {type: integer}
        monthToDateSpendYen: {type: integer}
        jobs: {type: array, items: {type: object, required: [id, title, category, applicationCount, progressLabel, status], properties: {id: {type: string, format: uuid}, title: {type: string}, category: {$ref: '#/components/schemas/JobCategory'}, applicationCount: {type: integer}, status: {$ref: '#/components/schemas/JobStatus'}, progressLabel: {type: string, enum: [募集中, 実施中, 検収待ち, 満員, 完了, 下書き, 審査中, 取消, 却下, 期限切れ]}, startsAt: {type: string, format: date-time}}}}
    Invoice:
      type: object
      required: [month, totalYen, lines]
      properties:
        month: {type: string}
        totalYen: {type: integer}
        workerPaymentsYen: {type: integer}
        expensesYen: {type: integer}
        platformFeeYen: {type: integer}
        taxYen: {type: integer}
        lines: {type: array, items: {type: object, required: [assignmentId, jobTitle, amountYen], properties: {assignmentId: {type: string, format: uuid}, jobTitle: {type: string}, workerDisplayName: {type: string}, workDate: {type: string, format: date}, amountYen: {type: integer}, expensesYen: {type: integer}, adjustmentsYen: {type: integer}}}}
    Decision:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties: {decision: {type: string, enum: [verified, rejected]}, reason: {type: string, minLength: 1, maxLength: 1000}, validUntil: {type: string, format: date}}
    AdminUser:
      type: object
      required: [id, displayName, verificationStatus, roles, createdAt]
      properties: {id: {type: string, format: uuid}, displayName: {type: string}, verificationStatus: {type: string}, roles: {type: array, items: {$ref: '#/components/schemas/Role'}}, suspended: {type: boolean}, phoneMasked: {type: string}, email: {type: string}, pendingSkillCount: {type: integer}, deleted: {type: boolean}, createdAt: {type: string, format: date-time}}
    AdminUserDetail:
      allOf:
        - {$ref: '#/components/schemas/AdminUser'}
        - type: object
          properties:
            profile: {$ref: '#/components/schemas/Profile'}
            vehicle: {$ref: '#/components/schemas/Vehicle'}
            bankAccount: {$ref: '#/components/schemas/BankAccountMasked'}
            skills: {type: array, items: {allOf: [{$ref: '#/components/schemas/Skill'}, {type: object, properties: {documentEvidenceIds: {type: array, items: {type: string, format: uuid}}}}]}}
            verificationDocumentIds: {type: array, items: {type: string, format: uuid}}
            verificationNote: {type: string}
            assignmentCount: {type: integer}
            ratingAverage: {type: number}
    AuditEvent:
      type: object
      required: [id, entityType, entityId, eventType, createdAt]
      properties: {id: {type: integer}, entityType: {type: string}, entityId: {type: string, format: uuid}, eventType: {type: string}, actorId: {type: string, format: uuid}, actorRole: {type: string}, reason: {type: string}, payload: {type: object, additionalProperties: true}, hash: {type: string}, createdAt: {type: string, format: date-time}}
    Reconciliation:
      type: object
      required: [month, acceptedSnapshotYen, ledgerEarnedYen, ledgerReversedYen, payoutsPaidYen, providerConfirmedYen, discrepancies]
      properties:
        month: {type: string}
        acceptedSnapshotYen: {type: integer}
        ledgerEarnedYen: {type: integer}
        ledgerReversedYen: {type: integer}
        payoutsPaidYen: {type: integer}
        providerConfirmedYen: {type: integer}
        failedPayoutCount: {type: integer}
        discrepancies: {type: array, items: {type: object, required: [type, message], properties: {type: {type: string, enum: [snapshot_mismatch, provider_unconfirmed, ledger_payout_mismatch, payout_failed, employment_payroll]}, message: {type: string}, assignmentId: {type: string, format: uuid}, payoutId: {type: string, format: uuid}, amountYen: {type: integer}}}}
    Analytics:
      type: object
      required: [from, to]
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        newWorkers: {type: integer}
        verifiedWorkers: {type: integer}
        publishedJobs: {type: integer}
        acceptedAssignments: {type: integer}
        approvedAssignments: {type: integer}
        cancelledAssignments: {type: integer}
        noShows: {type: integer}
        disputes: {type: integer}
        grossYen: {type: integer}
        deliveriesCompleted: {type: integer}
        deliveriesFailed: {type: integer}
        acceptConflicts: {type: integer}
        byCategory: {type: array, items: {type: object, properties: {category: {type: string}, jobs: {type: integer}, assignments: {type: integer}, grossYen: {type: integer}}}}
    MatchingConfig:
      type: object
      additionalProperties: false
      required: [weights, maxDistanceKm]
      properties:
        weights:
          type: object
          additionalProperties: false
          required: [distance, timeFit, skillFit, reliability, preference, fairness]
          properties: {distance: {type: number, minimum: 0, maximum: 1}, timeFit: {type: number, minimum: 0, maximum: 1}, skillFit: {type: number, minimum: 0, maximum: 1}, reliability: {type: number, minimum: 0, maximum: 1}, preference: {type: number, minimum: 0, maximum: 1}, fairness: {type: number, minimum: 0, maximum: 1}}
        maxDistanceKm: {type: number, minimum: 1, maximum: 100}
        reason: {type: string, maxLength: 500}
        updatedAt: {type: string, format: date-time}
        updatedBy: {type: string, format: uuid}
    MatchingAudit:
      type: object
      required: [impressions, exclusionReasons]
      properties:
        impressions: {type: integer}
        uniqueWorkersShown: {type: integer}
        top10PercentShare: {type: number, description: 提示回数上位10%の利用者が占める割合（偏りの指標）}
        acceptRate: {type: number}
        exclusionReasons: {type: array, items: {type: object, required: [reason, count], properties: {reason: {type: string}, count: {type: integer}}}}
        openAppeals: {type: integer}

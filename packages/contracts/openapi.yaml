        default: {$ref: '#/components/responses/Default'}
        '200': {description: 組織, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Organization'}}}}}
  /admin/organizations/{organizationId}:
    get:
      tags: [Admin]
      operationId: adminGetOrganization
      parameters: [{$ref: '#/components/parameters/OrganizationId'}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 組織, content: {application/json: {schema: {$ref: '#/components/schemas/Organization'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/organizations/{organizationId}/review:
    post:
      tags: [Admin]
      operationId: adminReviewOrganization
      parameters: [{$ref: '#/components/parameters/OrganizationId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [decision, reason], properties: {decision: {type: string, enum: [approved, rejected, suspended]}, reason: {type: string, minLength: 1, maxLength: 1000}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 結果, content: {application/json: {schema: {$ref: '#/components/schemas/Organization'}}}}
  /admin/jobs:
    get:
      tags: [Admin]
      operationId: adminListJobs
      parameters: [{name: status, in: query, schema: {$ref: '#/components/schemas/JobStatus'}}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 案件, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/OrgJob'}}}}}
  /admin/jobs/{jobId}:
    get:
      tags: [Admin]
      operationId: adminGetJob
      parameters: [{$ref: '#/components/parameters/JobId'}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 案件（住所・公開前チェックを含む）, content: {application/json: {schema: {$ref: '#/components/schemas/OrgJob'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/jobs/{jobId}/review:
    post:
      tags: [Admin]
      operationId: adminReviewJob
      parameters: [{$ref: '#/components/parameters/JobId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [decision, reason], properties: {decision: {type: string, enum: [published, rejected, cancelled]}, reason: {type: string, minLength: 1, maxLength: 1000}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 結果, content: {application/json: {schema: {$ref: '#/components/schemas/OrgJob'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
  /admin/assignments:
    get:
      tags: [Admin]
      operationId: adminListAssignments
      parameters: [{name: state, in: query, schema: {$ref: '#/components/schemas/AssignmentState'}}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 割当, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Assignment'}}}}}
  /admin/assignments/{assignmentId}/resolve-dispute:
    post:
      tags: [Admin]
      operationId: adminResolveDispute
      description: 紛争の裁定。pay_worker=満額確定、partial=指定額で確定（差額は記録）、no_pay=支払なし。支払済みの取消は逆仕訳（reversal/refund）。
      parameters: [{$ref: '#/components/parameters/AssignmentId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [resolution, reason], properties: {resolution: {type: string, enum: [pay_worker, partial, no_pay]}, amountYen: {type: integer, minimum: 1}, reason: {type: string, minLength: 1, maxLength: 1000}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 裁定済み, content: {application/json: {schema: {$ref: '#/components/schemas/Assignment'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
  /admin/assignments/{assignmentId}/reverse:
    post:
      tags: [Admin]
      operationId: adminReverseEarning
      description: 確定済み報酬の取消（返金）。台帳に逆仕訳を追加し、元の記録は変更しない。
      parameters: [{$ref: '#/components/parameters/AssignmentId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [amountYen, reason], properties: {amountYen: {type: integer, minimum: 1}, reason: {type: string, minLength: 1, maxLength: 1000}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 取消済み, content: {application/json: {schema: {$ref: '#/components/schemas/Assignment'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Validation'}
  /admin/assignments/{assignmentId}/reassign:
    post:
      tags: [Admin]
      operationId: adminReassign
      description: 元の割当を取消し、指定ドライバーに同条件で再割当（資格・時間重複を再検査）。
      parameters: [{$ref: '#/components/parameters/AssignmentId'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [workerId, reason], properties: {workerId: {type: string, format: uuid}, reason: {type: string, minLength: 1, maxLength: 1000}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '201': {description: 新しい割当, content: {application/json: {schema: {$ref: '#/components/schemas/Assignment'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/reports:
    get:
      tags: [Admin]
      operationId: adminListReports
      parameters: [{name: status, in: query, schema: {type: string, enum: [open, resolved]}}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 通報, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Report'}}}}}
  /admin/reports/{reportId}/resolve:
    post:
      tags: [Admin]
      operationId: adminResolveReport
      parameters: [{name: reportId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [action, reason], properties: {action: {type: string, enum: [no_action, hide_content, suspend_target, cancel_job]}, reason: {type: string, minLength: 1, maxLength: 1000}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 対応済み, content: {application/json: {schema: {$ref: '#/components/schemas/Report'}}}}
  /admin/support-tickets:
    get:
      tags: [Admin]
      operationId: adminListSupportTickets
      parameters: [{name: status, in: query, schema: {type: string, enum: [open, answered, closed]}}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 問い合わせ, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/SupportTicket'}}}}}
  /admin/support-tickets/{ticketId}/answer:
    post:
      tags: [Admin]
      operationId: adminAnswerSupportTicket
      parameters: [{name: ticketId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [answer], properties: {answer: {type: string, minLength: 1, maxLength: 4000}, close: {type: boolean}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 回答, content: {application/json: {schema: {$ref: '#/components/schemas/SupportTicket'}}}}
  /admin/payouts:
    get:
      tags: [Admin]
      operationId: adminListPayouts
      parameters: [{name: status, in: query, schema: {type: string, enum: [requested, processing, paid, failed]}}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 振込, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Payout'}}}}}
  /admin/payouts/batches:
    post:
      tags: [Admin]
      operationId: adminCreatePayoutBatch
      description: payable の報酬を利用者ごとに集計して振込要求を作成し、決済事業者へ送信。二重振込防止キーを利用。決済事業者未契約の本番構成では 503。
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false, required: [cutoffDate], properties: {cutoffDate: {type: string, format: date}}}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '201': {description: 作成, content: {application/json: {schema: {$ref: '#/components/schemas/PayoutBatch'}}}}
        '503': {$ref: '#/components/responses/Unavailable'}
  /admin/payouts/{payoutId}/retry:
    post:
      tags: [Admin]
      operationId: adminRetryPayout
      parameters: [{name: payoutId, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 再試行, content: {application/json: {schema: {$ref: '#/components/schemas/Payout'}}}}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/reconciliation:
    get:
      tags: [Admin]
      operationId: adminReconciliation
      description: 月次照合。受諾スナップショット合計・台帳合計・振込合計・決済事業者の確認済み額の差異を返す。
      parameters: [{name: month, in: query, required: true, schema: {type: string, pattern: '^[0-9]{4}-[0-9]{2}$'}}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 照合結果, content: {application/json: {schema: {$ref: '#/components/schemas/Reconciliation'}}}}
  /admin/audit-events:
    get:
      tags: [Admin]
      operationId: adminListAuditEvents
      parameters: [{name: entityType, in: query, schema: {type: string}}, {name: entityId, in: query, schema: {type: string, format: uuid}}, {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500}}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 監査イベント, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AuditEvent'}}}}}
  /admin/audit-events/verify:
    get:
      tags: [Admin]
      operationId: adminVerifyAuditChain
      description: 追記式イベントのハッシュ連鎖を検証し、改変の有無を返す。
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 検証結果, content: {application/json: {schema: {type: object, required: [valid, checked], properties: {valid: {type: boolean}, checked: {type: integer}, firstInvalidId: {type: integer}}}}}}
  /admin/analytics:
    get:
      tags: [Admin]
      operationId: adminAnalytics
      parameters: [{name: from, in: query, required: true, schema: {type: string, format: date}}, {name: to, in: query, required: true, schema: {type: string, format: date}}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 分析, content: {application/json: {schema: {$ref: '#/components/schemas/Analytics'}}}}
  /admin/matching/config:
    get:
      tags: [Admin]
      operationId: adminGetMatchingConfig
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 重み, content: {application/json: {schema: {$ref: '#/components/schemas/MatchingConfig'}}}}
    put:
      tags: [Admin]
      operationId: adminUpdateMatchingConfig
      description: reason（変更理由）は必須。変更は監査イベントとして記録される。
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MatchingConfig'}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 更新（監査記録）, content: {application/json: {schema: {$ref: '#/components/schemas/MatchingConfig'}}}}
  /admin/matching/audit:
    get:
      tags: [Admin]
      operationId: adminMatchingAudit
      description: 推薦の除外理由の分布、提示回数の偏り（上位10%への集中度）、受諾率を返す。
      parameters: [{name: from, in: query, required: true, schema: {type: string, format: date}}, {name: to, in: query, required: true, schema: {type: string, format: date}}]
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 監査, content: {application/json: {schema: {$ref: '#/components/schemas/MatchingAudit'}}}}
  /admin/deletion-requests:
    get:
      tags: [Admin]
      operationId: adminListDeletionRequests
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 削除要求, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/DeletionRequest'}}}}}

  # ---------------------------------------------------------------- Webhooks
  /webhooks/payments/{provider}:
    post:
      tags: [Webhooks]
      operationId: paymentWebhook
      security: []
      description: 決済事業者Webhook。署名検証・イベントID一意・順不同耐性。入金/振込の成立はWebhookのみでなく事業者APIで照合する。
      parameters: [{name: provider, in: path, required: true, schema: {type: string}}]
      requestBody: {required: true, content: {application/json: {schema: {type: object}}}}
      responses:
        default: {$ref: '#/components/responses/Default'}
        '200': {description: 受理（重複も200）}
        '401': {$ref: '#/components/responses/Unauthorized'}

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    JobId: {name: jobId, in: path, required: true, schema: {type: string, format: uuid}}
    StopId: {name: stopId, in: path, required: true, schema: {type: string, format: uuid}}
    AssignmentId: {name: assignmentId, in: path, required: true, schema: {type: string, format: uuid}}
    OrganizationId: {name: organizationId, in: path, required: true, schema: {type: string, format: uuid}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 16, maxLength: 128}}
  responses:
    Unauthorized: {description: 認証が必要, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Forbidden: {description: 権限がない, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: 見つからない, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Conflict: {description: 状態・残枠・重複要求の競合, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Validation: {description: 入力または業務制約に違反, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    TooManyRequests: {description: 回数制限, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Gone: {description: 保管期限切れ, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Unavailable: {description: 依存先停止または未契約, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    Default: {description: その他のエラー（401 認証 / 403 権限 / 404 不存在・他組織 / 422 入力 / 429 回数制限 / 5xx）。本文は常に Error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string, description: '機械判定用コード（例 capacity_full / not_eligible / invalid_state）'}
        message: {type: string, description: 利用者に表示できる日本語}
        requestId: {type: string}
        details: {type: object, additionalProperties: true}
    Point:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties: {latitude: {type: number, minimum: -90, maximum: 90}, longitude: {type: number, minimum: -180, maximum: 180}}
    Tokens:
      type: object
      required: [accessToken, refreshToken, accessTokenExpiresAt, refreshTokenExpiresAt]
      properties: {accessToken: {type: string}, refreshToken: {type: string}, accessTokenExpiresAt: {type: string, format: date-time}, refreshTokenExpiresAt: {type: string, format: date-time}}
    AuthResult:
      type: object
      required: [tokens, user, isNewUser]
      properties: {tokens: {$ref: '#/components/schemas/Tokens'}, user: {$ref: '#/components/schemas/User'}, isNewUser: {type: boolean}}
    WebLoginChallenge:
      type: object
      required: [mfaToken, mfaEnrollmentRequired]
      properties:
        mfaToken: {type: string, description: 5分有効}
        mfaEnrollmentRequired: {type: boolean}
        totpUri: {type: string, description: 未登録時のみ。otpauth:// URI（QR表示用）}
    Role:
      type: string
      enum: [worker, org_member, admin_operator, admin_support, admin_auditor]
    User:
      type: object
      required: [id, displayName, verificationStatus]
      properties:
        id: {type: string, format: uuid}
        displayName: {type: string}
        verificationStatus: {type: string, enum: [unsubmitted, pending, verified, rejected]}
        verificationNote: {type: string}
        skills: {type: array, items: {type: string}, description: 有効な資格コード（v1.0互換）}
        skillDetails: {type: array, items: {$ref: '#/components/schemas/Skill'}}
        roles: {type: array, items: {$ref: '#/components/schemas/Role'}}
        phoneMasked: {type: string}
        email: {type: string}
        termsAccepted: {type: boolean}
        profile: {$ref: '#/components/schemas/Profile'}
        vehicle: {$ref: '#/components/schemas/Vehicle'}
        bankAccount: {$ref: '#/components/schemas/BankAccountMasked'}
        preferences: {$ref: '#/components/schemas/Preferences'}
        organizations: {type: array, items: {type: object, required: [id, legalName, role, reviewStatus], properties: {id: {type: string, format: uuid}, legalName: {type: string}, role: {type: string, enum: [owner, manager, reviewer]}, reviewStatus: {type: string, enum: [pending, approved, rejected, suspended]}}}}
        ratingAverage: {type: number}
        ratingCount: {type: integer}
        completedJobCount: {type: integer}
        suspended: {type: boolean}
        onboardingSteps:
          type: object
          description: 登録の進捗（未完了の項目がある間は受諾不可）
          properties: {terms: {type: boolean}, profile: {type: boolean}, vehicle: {type: boolean}, bankAccount: {type: boolean}, verification: {type: boolean}}
    ProfileInput:
      type: object
      additionalProperties: false
      required: [legalName, legalNameKana, birthDate, postalCode, address]
      properties:
        legalName: {type: string, minLength: 1, maxLength: 100}
        legalNameKana: {type: string, pattern: '^[ァ-ヶー　 ]+$', maxLength: 100}
        birthDate: {type: string, format: date}
        postalCode: {type: string, pattern: '^[0-9]{3}-?[0-9]{4}$'}
        address: {type: string, minLength: 4, maxLength: 200}
        invoiceRegistrationNumber: {type: string, pattern: '^T[0-9]{13}$', description: 適格請求書発行事業者番号（任意）}
    Profile:
      type: object
      properties: {legalName: {type: string}, legalNameKana: {type: string}, birthDate: {type: string, format: date}, postalCode: {type: string}, address: {type: string}, invoiceRegistrationNumber: {type: string}}
    Vehicle:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type: {type: string, enum: [kei_van, kei_truck, car, motorbike, bicycle, none]}
        plateNumber: {type: string, maxLength: 30}
        blackPlateRegistered: {type: boolean, description: 貨物軽自動車運送事業の届出（黒ナンバー）}
        cargoCapacityKg: {type: integer, minimum: 0, maximum: 5000}
    BankAccountInput:
      type: object
      additionalProperties: false
      required: [bankCode, branchCode, accountType, accountNumber, holderNameKana]
      properties:
        bankCode: {type: string, pattern: '^[0-9]{4}$'}
        branchCode: {type: string, pattern: '^[0-9]{3}$'}
        accountType: {type: string, enum: [ordinary, checking, savings]}
        accountNumber: {type: string, pattern: '^[0-9]{7}$'}
        holderNameKana: {type: string, pattern: '^[ァ-ヶー　 ()（）.．]+$', maxLength: 60}
    BankAccountMasked:
      type: object
      properties: {bankCode: {type: string}, branchCode: {type: string}, accountType: {type: string}, accountNumberLast4: {type: string}, holderNameKana: {type: string}}
    Preferences:
      type: object
      additionalProperties: false
      properties:
        useLocationForMatching: {type: boolean}
        useHistoryForMatching: {type: boolean}
        preferredCategories: {type: array, items: {$ref: '#/components/schemas/JobCategory'}}
        maxDistanceKm: {type: number, minimum: 1, maximum: 100}
        notifyNewJobs: {type: boolean}
        notifyMessages: {type: boolean}
        showRatingToOrganizations: {type: boolean}
    Skill:
      type: object
      required: [code, name, status]
      properties:
        code: {type: string}
        name: {type: string}
        status: {type: string, enum: [pending, verified, rejected, expired]}
        source: {type: string, enum: [training, document]}
        validUntil: {type: string, format: date}
        note: {type: string}
    SkillDefinition:
      type: object
      required: [code, name, source]
      properties: {code: {type: string}, name: {type: string}, source: {type: string, enum: [training, document]}, description: {type: string}, courseId: {type: string}}
    DeletionRequest:
      type: object
      required: [status, retentionNotice]
      properties:
        id: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        status: {type: string, enum: [confirmation_required, completed]}
        requestedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
        retentionNotice: {type: string, description: 法令等で保持する情報と期間の説明}
        blockers: {type: array, items: {type: string}}
    SupportTicket:
      type: object
      required: [id, category, body, status, createdAt]
      properties: {id: {type: string, format: uuid}, userId: {type: string, format: uuid}, userDisplayName: {type: string}, category: {type: string, enum: [account, payment, job, delivery, safety, privacy, other, matching_appeal]}, body: {type: string}, answer: {type: string}, status: {type: string, enum: [open, answered, closed]}, assignmentId: {type: string, format: uuid}, jobId: {type: string, format: uuid}, createdAt: {type: string, format: date-time}}

    NewStop:
      type: object
      additionalProperties: false
      required: [address, scheduledDate]
      properties:
        address: {type: string, minLength: 4, maxLength: 200}
        scheduledDate: {type: string, format: date}
        location: {$ref: '#/components/schemas/Point'}
        timeWindowStart: {type: string, format: date-time}
        timeWindowEnd: {type: string, format: date-time}
        note: {type: string, maxLength: 2000}
        recipientName: {type: string, maxLength: 100}
        recipientPhone: {type: string, pattern: '^[0-9+\-]{10,15}$'}
        packageNumber: {type: string, maxLength: 60}
        priority: {type: integer, minimum: 0, maximum: 2, description: 0=通常 1=高 2=最優先}
        serviceMinutes: {type: integer, minimum: 0, maximum: 120}
        source: {type: string, enum: [manual, csv, ocr]}
        allowDuplicate: {type: boolean, description: 重複警告を確認済みで登録する場合 true}
    StopUpdate:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: {type: integer}
        address: {type: string, minLength: 4, maxLength: 200}
        location: {$ref: '#/components/schemas/Point'}
        timeWindowStart: {type: [string, 'null'], format: date-time}
        timeWindowEnd: {type: [string, 'null'], format: date-time}
        note: {type: [string, 'null'], maxLength: 2000}
        recipientName: {type: [string, 'null'], maxLength: 100}
        recipientPhone: {type: [string, 'null'], pattern: '^[0-9+\-]{10,15}$'}
        packageNumber: {type: [string, 'null'], maxLength: 60}
        priority: {type: integer, minimum: 0, maximum: 2}
        serviceMinutes: {type: integer, minimum: 0, maximum: 120}
    Stop:
      type: object
      required: [id, status, address, scheduledDate, version, hasLocation, priority, serviceMinutes, hasRecipientPhone]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [draft, ready, en_route, arrived, delivered, failed, deferred]}
        address: {type: string}
        scheduledDate: {type: string, format: date}
        location: {$ref: '#/components/schemas/Point'}
        hasLocation: {type: boolean}
        timeWindowStart: {type: string, format: date-time}
        timeWindowEnd: {type: string, format: date-time}
        note: {type: string}
        recipientName: {type: string}
        hasRecipientPhone: {type: boolean}
        packageNumber: {type: string}
        priority: {type: integer}
        serviceMinutes: {type: integer}
        sequence: {type: integer}
        estimatedArrivalAt: {type: string, format: date-time}
        failureReason: {type: string}
        failureNote: {type: string}
        deferredUntil: {type: string, format: date-time}
        handoff: {type: string}
        completedAt: {type: string, format: date-time}
        evidenceIds: {type: array, items: {type: string, format: uuid}}
        duplicateOfStopId: {type: string, format: uuid}
        version: {type: integer}
        source: {type: string}
    StopImportResult:
      type: object
      required: [created, duplicates, errors, dryRun]
      properties:
        dryRun: {type: boolean}
        created: {type: array, items: {$ref: '#/components/schemas/Stop'}}
        valid: {type: integer}
        duplicates: {type: array, items: {type: object, required: [row, address], properties: {row: {type: integer}, address: {type: string}, existingStopId: {type: string, format: uuid}, duplicateOfRow: {type: integer}}}}
        errors: {type: array, items: {type: object, required: [row, message], properties: {row: {type: integer}, message: {type: string}}}}
    RouteRequest:
      type: object
      additionalProperties: false
      required: [date, stopIds]
      properties:
        date: {type: string, format: date}
        stopIds: {type: array, minItems: 2, maxItems: 200, items: {type: string, format: uuid}}
        startLocation: {$ref: '#/components/schemas/Point'}
        endLocation: {$ref: '#/components/schemas/Point'}
        departureAt: {type: string, format: date-time}
        breaks: {type: array, maxItems: 4, items: {type: object, additionalProperties: false, required: [earliestStart, latestStart, durationMinutes], properties: {earliestStart: {type: string, format: date-time}, latestStart: {type: string, format: date-time}, durationMinutes: {type: integer, minimum: 5, maximum: 120}}}}
        averageSpeedKmh: {type: number, minimum: 5, maximum: 80}
    Route:
      type: object
      required: [orderedStopIds, estimatedMinutes, feasible]
      properties:
        id: {type: string, format: uuid}
        date: {type: string, format: date}
        status: {type: string, enum: [planned, in_progress, completed]}
        orderedStopIds: {type: array, items: {type: string, format: uuid}}
        estimatedMinutes: {type: integer, minimum: 0}
        totalDistanceKm: {type: number}
        feasible: {type: boolean}
        warnings: {type: array, items: {type: string}}
        violations: {type: array, items: {type: object, required: [stopId, type, message], properties: {stopId: {type: string, format: uuid}, type: {type: string, enum: [time_window_late, break_unplaced, priority_late]}, message: {type: string}, minutes: {type: integer}}}}
        legs: {type: array, items: {$ref: '#/components/schemas/RouteLeg'}}
        breaks: {type: array, items: {type: object, required: [startAt, durationMinutes, afterStopId], properties: {startAt: {type: string, format: date-time}, durationMinutes: {type: integer}, afterStopId: {type: [string, 'null']}}}}
        travelTimeSource: {type: string, enum: [estimated, provider]}
        departureAt: {type: string, format: date-time}
        startLocation: {$ref: '#/components/schemas/Point'}
        createdAt: {type: string, format: date-time}
        manuallyOrdered: {type: boolean}
    RouteLeg:
      type: object
      required: [stopId, arrivalAt, departureAt, travelMinutes, distanceKm]
      properties: {stopId: {type: string, format: uuid}, arrivalAt: {type: string, format: date-time}, departureAt: {type: string, format: date-time}, travelMinutes: {type: integer}, distanceKm: {type: number}, waitMinutes: {type: integer}, lateMinutes: {type: integer}}
    DeliveryDayReport:
      type: object
      required: [date, total, delivered, failed, deferred]
      properties: {date: {type: string, format: date}, total: {type: integer}, delivered: {type: integer}, failed: {type: integer}, deferred: {type: integer}, pending: {type: integer}, estimatedDistanceKm: {type: number}}

    JobCategory:
      type: string
      enum: [elderly_watch, life_support, shopping_assist, corporate_task, community_info, delivery_related, personal_care, healthcare]
      description: personal_care（身体介護）と healthcare（医療処置）は資格要件・事業審査が確定するまで公開不可。
    JobStatus:
      type: string
      enum: [draft, pending_review, published, filled, expired, cancelled, rejected, completed]
    ContractType:
      type: string
      enum: [employment, contractor, other_legal_review]
      description: other_legal_review（その他・法務審査中）は公開不可。
    CancellationPolicy:
      type: object
      additionalProperties: false
      required: [freeCancelHoursBefore, lateCancelCompensationPercent, text]
      properties:
        freeCancelHoursBefore: {type: integer, minimum: 0, maximum: 168, description: 開始何時間前まで無償取消できるか（双方）}
        lateCancelCompensationPercent: {type: integer, minimum: 0, maximum: 100, description: 締切後に発注者が取消した場合の補償率}
        text: {type: string, minLength: 1, maxLength: 2000}
    JobStep:
      type: object
      additionalProperties: false
      required: [title]
      properties: {title: {type: string, minLength: 1, maxLength: 100}, description: {type: string, maxLength: 1000}, requiresPhoto: {type: boolean}}
    NewJob:
      type: object
      additionalProperties: false
      required: [title, category, contractType, startsAt, endsAt, amountYen, capacity, address, location, areaLabel, description, cancellationPolicy, steps]
      properties:
        title: {type: string, minLength: 4, maxLength: 80}
        category: {$ref: '#/components/schemas/JobCategory'}
        contractType: {$ref: '#/components/schemas/ContractType'}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        amountYen: {type: integer, minimum: 1, maximum: 1000000}
        expensesReimbursedYen: {type: integer, minimum: 0, maximum: 100000, description: 発注者が負担する実費（交通費等）}
        workerBorneCostsNote: {type: string, maxLength: 500, description: ドライバー負担の費用（燃料・通信等）の説明}
        capacity: {type: integer, minimum: 1, maximum: 500}
        siteId: {type: string, format: uuid}
        address: {type: string, minLength: 4, maxLength: 200, description: 受諾者と発注組織のみ閲覧可}
        location: {$ref: '#/components/schemas/Point'}
        areaLabel: {type: string, minLength: 2, maxLength: 40, description: 公開用の粗い地域名（例 横浜市中区）}
        description: {type: string, minLength: 10, maxLength: 4000}
        requiredSkills: {type: array, maxItems: 10, items: {type: string}}
        cancellationPolicy: {$ref: '#/components/schemas/CancellationPolicy'}
        steps: {type: array, minItems: 1, maxItems: 20, items: {$ref: '#/components/schemas/JobStep'}}
        minPhotoCount: {type: integer, minimum: 0, maximum: 20}
        requiresOrgApproval: {type: boolean}
        reservationTtlMinutes: {type: integer, minimum: 10, maximum: 1440}
        checkInRadiusMeters: {type: integer, minimum: 50, maximum: 2000}
        meetingPointNote: {type: string, maxLength: 500}
        safetyNotes: {type: string, maxLength: 1000}
        contactName: {type: string, minLength: 1, maxLength: 60}
        paymentTermsText: {type: string, minLength: 1, maxLength: 500, description: 支払期日・方法（業務委託は取引条件明示）}
        employmentTermsText: {type: string, maxLength: 4000, description: 雇用の場合の労働条件（就業場所・時間・賃金・休憩等）}
    JobPublic:
      type: object
      required: [id, organizationId, organizationName, title, category, contractType, status, startsAt, endsAt, amountYen, capacity, remainingCapacity, areaLabel, description, cancellationPolicy, steps, requiredSkills]
      properties:
        id: {type: string, format: uuid}
        organizationId: {type: string, format: uuid}
        organizationName: {type: string}
        organizationVerified: {type: boolean}
        organizationAddress: {type: string}
        organizationContact: {type: string}
        title: {type: string}
        category: {$ref: '#/components/schemas/JobCategory'}
        contractType: {$ref: '#/components/schemas/ContractType'}
        status: {$ref: '#/components/schemas/JobStatus'}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        amountYen: {type: integer}
        expensesReimbursedYen: {type: integer}
        workerBorneCostsNote: {type: string}
        capacity: {type: integer}
        remainingCapacity: {type: integer, minimum: 0}
        areaLabel: {type: string}
        approximateLocation: {$ref: '#/components/schemas/Point'}
        distanceKm: {type: number}
        description: {type: string}
        requiredSkills: {type: array, items: {type: string}}
        requiredSkillNames: {type: array, items: {type: string}}
        cancellationPolicy: {$ref: '#/components/schemas/CancellationPolicy'}
        steps: {type: array, items: {$ref: '#/components/schemas/JobStep'}}
        minPhotoCount: {type: integer}
        requiresOrgApproval: {type: boolean}
        meetingPointNote: {type: string}
        safetyNotes: {type: string}
        contactName: {type: string}
        paymentTermsText: {type: string}
        employmentTermsText: {type: string}
        durationMinutes: {type: integer}
        publishedAt: {type: string, format: date-time}
        termsHash: {type: string, description: 受諾時に送り返す条件のハッシュ}
    Job:
      allOf:
        - {$ref: '#/components/schemas/JobPublic'}
        - type: object
          properties:
            matchReasons: {type: array, items: {type: string}}
            matchScore: {type: number}
            eligible: {type: boolean}
            ineligibleReasons: {type: array, items: {type: string}}
            isFavorite: {type: boolean}
            waitlisted: {type: boolean}
            myAssignmentId: {type: string, format: uuid}
    OrgJob:
      allOf:
        - {$ref: '#/components/schemas/JobPublic'}
        - type: object
          required: [address, location, createdAt]
          properties:
            address: {type: string}
            location: {$ref: '#/components/schemas/Point'}
            siteId: {type: string, format: uuid}
            reviewNote: {type: string}
            createdAt: {type: string, format: date-time}
            checkInRadiusMeters: {type: integer}
            reservationTtlMinutes: {type: integer}
            applicationCount: {type: integer}
            activeCount: {type: integer}
            awaitingReviewCount: {type: integer}
            waitlistCount: {type: integer}
            publishChecks: {type: array, items: {type: object, required: [code, ok, message], properties: {code: {type: string}, ok: {type: boolean}, message: {type: string}}}}
    AssignmentState:
      type: string
      enum: [reserved, accepted, traveling, checked_in, working, submitted, needs_revision, approved, payable, paid, cancelled, declined, expired, no_show, disputed, refunded]
    Assignment:
      type: object
      required: [id, jobId, workerId, state]
      properties:
        id: {type: string, format: uuid}
        jobId: {type: string, format: uuid}
        workerId: {type: string, format: uuid}
        workerDisplayName: {type: string}
        workerRatingAverage: {type: number}
        state: {$ref: '#/components/schemas/AssignmentState'}
        acceptedAmountYen: {type: integer, minimum: 1}
        acceptedAt: {type: string, format: date-time}
        reservationExpiresAt: {type: string, format: date-time}
        termsSnapshot: {type: object, additionalProperties: true}
        job:
          type: object
          required: [title, category, startsAt, endsAt, organizationName]
          properties:
            title: {type: string}
            category: {$ref: '#/components/schemas/JobCategory'}
            contractType: {$ref: '#/components/schemas/ContractType'}
            startsAt: {type: string, format: date-time}
            endsAt: {type: string, format: date-time}
            organizationId: {type: string, format: uuid}
            organizationName: {type: string}
            areaLabel: {type: string}
            address: {type: string, description: 閲覧権限がある場合のみ}
            location: {$ref: '#/components/schemas/Point'}
            checkInRadiusMeters: {type: integer}
            meetingPointNote: {type: string}
            safetyNotes: {type: string}
            minPhotoCount: {type: integer}
        steps: {type: array, items: {type: object, required: [index, title, completed], properties: {index: {type: integer}, title: {type: string}, description: {type: string}, requiresPhoto: {type: boolean}, completed: {type: boolean}, completedAt: {type: string, format: date-time}}}}
        checkedInAt: {type: string, format: date-time}
        workStartedAt: {type: string, format: date-time}
        submittedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
        reportNote: {type: string}
        reviewReason: {type: string}
        evidence: {type: array, items: {$ref: '#/components/schemas/Evidence'}}
        timeline: {type: array, items: {type: object, required: [eventType, at], properties: {eventType: {type: string}, at: {type: string, format: date-time}, actorRole: {type: string}, reason: {type: string}}}}
        earning: {type: object, properties: {state: {type: string, enum: [estimated, pending, payable, paid, failed, reversed]}, amountYen: {type: integer}, scheduledPayoutDate: {type: string, format: date}}}
        myRatingSubmitted: {type: boolean}
        lateCancellation: {type: boolean}
    Evidence:
      type: object
      required: [id, purpose, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        purpose: {type: string}
        status: {type: string, enum: [pending_upload, verified, rejected]}
        contentType: {type: string}
        byteSize: {type: integer}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
    Message:
      type: object
      required: [id, assignmentId, senderRole, body, createdAt]
      properties: {id: {type: string, format: uuid}, assignmentId: {type: string, format: uuid}, senderRole: {type: string, enum: [worker, organization, operator, system]}, senderName: {type: string}, isMine: {type: boolean}, body: {type: string}, evidenceId: {type: string, format: uuid}, hidden: {type: boolean}, createdAt: {type: string, format: date-time}}
    Report:
      type: object
      required: [id, targetType, targetId, reason, status, createdAt]
      properties: {id: {type: string, format: uuid}, reporterId: {type: string, format: uuid}, targetType: {type: string}, targetId: {type: string, format: uuid}, reason: {type: string}, detail: {type: string}, status: {type: string, enum: [open, resolved]}, resolution: {type: string}, createdAt: {type: string, format: date-time}}
    Notification:
      type: object
      required: [id, type, title, body, createdAt]
      properties: {id: {type: string, format: uuid}, type: {type: string}, title: {type: string}, body: {type: string}, entityType: {type: string}, entityId: {type: string, format: uuid}, readAt: {type: string, format: date-time}, createdAt: {type: string, format: date-time}}
    HomeSummary:
      type: object
      required: [todayStopCount, todayCompletedStopCount, todayAssignments, expectedEarningsYen, unreadNotificationCount, nearbyJobs]
      properties:
        todayStopCount: {type: integer}
        todayCompletedStopCount: {type: integer}
        todayRoute: {$ref: '#/components/schemas/Route'}
        todayAssignments: {type: array, items: {$ref: '#/components/schemas/Assignment'}}
        expectedEarningsYen: {type: integer, description: 本日の受諾済み案件の確定条件の合計（配送の売上は含まない）}
        unreadNotificationCount: {type: integer}
        nearbyJobs: {type: array, items: {$ref: '#/components/schemas/Job'}}
        onboardingComplete: {type: boolean}
    EarningEntry:
      type: object
      required: [assignmentId, amountYen, state]
      properties:
        id: {type: string, format: uuid}
        assignmentId: {type: string, format: uuid}
        jobTitle: {type: string}
        organizationName: {type: string}
        contractType: {$ref: '#/components/schemas/ContractType'}
        amountYen: {type: integer}
        state: {type: string, enum: [estimated, pending, payable, paid, failed, reversed]}
        scheduledPayoutDate: {type: string, format: date}
        paidAt: {type: string, format: date-time}
        workDate: {type: string, format: date}
        breakdown: {type: array, items: {type: object, required: [type, amountYen], properties: {type: {type: string}, amountYen: {type: integer}, note: {type: string}}}}
    EarningsSummary:
      type: object
      required: [month, totalYen, paidYen, payableYen, pendingYen, estimatedYen, completedCount]
      properties: {month: {type: string}, totalYen: {type: integer}, paidYen: {type: integer}, payableYen: {type: integer}, pendingYen: {type: integer}, estimatedYen: {type: integer}, completedCount: {type: integer}, employmentYen: {type: integer}, contractorYen: {type: integer}}
    Payout:
      type: object
      required: [id, amountYen, status, createdAt]
      properties: {id: {type: string, format: uuid}, workerId: {type: string, format: uuid}, workerDisplayName: {type: string}, amountYen: {type: integer}, status: {type: string, enum: [requested, processing, paid, failed]}, failureReason: {type: string}, providerReference: {type: string}, attemptCount: {type: integer}, scheduledDate: {type: string, format: date}, paidAt: {type: string, format: date-time}, createdAt: {type: string, format: date-time}}
    PayoutBatch:
      type: object
      required: [id, cutoffDate, payoutCount, totalYen]
      properties: {id: {type: string, format: uuid}, cutoffDate: {type: string, format: date}, payoutCount: {type: integer}, totalYen: {type: integer}, payouts: {type: array, items: {$ref: '#/components/schemas/Payout'}}}
    CourseSummary:
      type: object
      required: [id, title, category, durationMinutes, completed]
      properties: {id: {type: string}, title: {type: string}, category: {type: string}, summary: {type: string}, durationMinutes: {type: integer}, grantsSkill: {type: string}, grantsSkillName: {type: string}, completed: {type: boolean}, skillValidUntil: {type: string, format: date}}
    Course:
      allOf:
        - {$ref: '#/components/schemas/CourseSummary'}
        - type: object
          required: [lessons, questions, passScore]
          properties:
            lessons: {type: array, items: {type: object, required: [title, body], properties: {title: {type: string}, body: {type: string}}}}
            questions: {type: array, items: {type: object, required: [id, question, choices], properties: {id: {type: string}, question: {type: string}, choices: {type: array, items: {type: string}}}}}
            passScore: {type: integer}
    QuizResult:
      type: object
      required: [passed, score, total]
      properties: {passed: {type: boolean}, score: {type: integer}, total: {type: integer}, grantedSkill: {$ref: '#/components/schemas/Skill'}, incorrectQuestionIds: {type: array, items: {type: string}}}
    OrganizationInput:
      type: object
      additionalProperties: false
      required: [legalName, address, contact, representativeName]
      properties:
        legalName: {type: string, minLength: 2, maxLength: 120}
        kind: {type: string, enum: [company, municipality, npo, other]}
        corporateNumber: {type: string, pattern: '^[0-9]{13}$', description: 法人番号}
        address: {type: string, minLength: 4, maxLength: 200}
        contact: {type: string, minLength: 4, maxLength: 200, description: 公開される連絡先（電話またはメール）}
        representativeName: {type: string, minLength: 1, maxLength: 100}
    Organization:
      type: object
      required: [id, legalName, address, contact, reviewStatus, createdAt]
      properties: {id: {type: string, format: uuid}, legalName: {type: string}, kind: {type: string}, corporateNumber: {type: string}, address: {type: string}, contact: {type: string}, representativeName: {type: string}, reviewStatus: {type: string, enum: [pending, approved, rejected, suspended]}, reviewNote: {type: string}, createdAt: {type: string, format: date-time}}
    SiteInput:
      type: object
      additionalProperties: false
      required: [name, address, location, areaLabel]
      properties: {name: {type: string, minLength: 1, maxLength: 80}, address: {type: string, minLength: 4, maxLength: 200}, location: {$ref: '#/components/schemas/Point'}, areaLabel: {type: string, minLength: 2, maxLength: 40}}
    Site:
      type: object
      required: [id, name, address, location, areaLabel]
      properties: {id: {type: string, format: uuid}, name: {type: string}, address: {type: string}, location: {$ref: '#/components/schemas/Point'}, areaLabel: {type: string}}
    Member:
      type: object
      required: [userId, displayName, role]
      properties: {userId: {type: string, format: uuid}, displayName: {type: string}, email: {type: string}, role: {type: string, enum: [owner, manager, reviewer]}, mfaEnabled: {type: boolean}}
